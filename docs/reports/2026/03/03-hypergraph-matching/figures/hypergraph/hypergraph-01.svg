<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310">

  <!-- Hyperedge (1,2,3) - orange -->
  <g opacity="0.50">
    <path d="M 85,155 L 215,82 L 215,228 Z"
          fill="#F08040" stroke="#F08040"
          stroke-width="80" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Hyperedge (2,3,4) - blue -->
  <g opacity="0.50">
    <path d="M 215,82 L 215,228 L 375,155 Z"
          fill="#4080D0" stroke="#4080D0"
          stroke-width="80" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Hyperedge (4,5,6) - green -->
  <g opacity="0.50">
    <path d="M 375,155 L 505,82 L 505,228 Z"
          fill="#40A840" stroke="#40A840"
          stroke-width="80" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Hyperedge weight labels -->
  <text x="150" y="155" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central">10</text>
  <text x="295" y="155" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central">20</text>
  <text x="440" y="155" font-family="Arial,sans-serif" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central">30</text>

  <!-- Vertex circles -->
  <circle cx="85"  cy="155" r="20" fill="white" stroke="#222" stroke-width="2.5"/>
  <circle cx="215" cy="82"  r="20" fill="white" stroke="#222" stroke-width="2.5"/>
  <circle cx="215" cy="228" r="20" fill="white" stroke="#222" stroke-width="2.5"/>
  <circle cx="375" cy="155" r="20" fill="white" stroke="#222" stroke-width="2.5"/>
  <circle cx="505" cy="82"  r="20" fill="white" stroke="#222" stroke-width="2.5"/>
  <circle cx="505" cy="228" r="20" fill="white" stroke="#222" stroke-width="2.5"/>

  <!-- Vertex labels -->
  <text x="85"  y="155" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="215" y="82"  font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="215" y="228" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="375" y="155" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="505" y="82"  font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">5</text>
  <text x="505" y="228" font-family="Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">6</text>

</svg>
