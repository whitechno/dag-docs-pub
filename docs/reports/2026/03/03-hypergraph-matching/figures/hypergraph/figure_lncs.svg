<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 580">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; }
  </style>

  <!-- "1 + ε" label on the left -->
  <text x="44" y="290" font-size="50" font-style="italic"
        text-anchor="middle" dominant-baseline="central">1 + &#x3B5;</text>

  <!-- Yellow pills (hyperedges {x_i, y_i} with weight 1) -->
  <rect x="148" y="28"  width="400" height="124" rx="62" fill="#F0B87A" stroke="#1C1C1C" stroke-width="2.5"/>
  <rect x="148" y="228" width="400" height="124" rx="62" fill="#F0B87A" stroke="#1C1C1C" stroke-width="2.5"/>
  <rect x="148" y="428" width="400" height="124" rx="62" fill="#F0B87A" stroke="#1C1C1C" stroke-width="2.5"/>

  <!-- Blue dashed rounded rect (hyperedge {x_1,...,x_d} with weight 1+ε) -->
  <rect x="118" y="22" width="178" height="536" rx="80"
        fill="rgb(138,140,218)" fill-opacity="0.68"
        stroke="#7A6A12" stroke-width="2.8" stroke-dasharray="11,8"/>

  <!-- x vertex circles (brownish-mauve, in the overlap zone) -->
  <circle cx="203" cy="90"  r="45" fill="#C49070" stroke="#1C1C1C" stroke-width="2.5"/>
  <circle cx="203" cy="290" r="45" fill="#C49070" stroke="#1C1C1C" stroke-width="2.5"/>
  <circle cx="203" cy="490" r="45" fill="#C49070" stroke="#1C1C1C" stroke-width="2.5"/>

  <!-- y vertex circles (golden-tan) -->
  <circle cx="493" cy="90"  r="45" fill="#E0CA72" stroke="#1C1C1C" stroke-width="2.5"/>
  <circle cx="493" cy="290" r="45" fill="#E0CA72" stroke="#1C1C1C" stroke-width="2.5"/>
  <circle cx="493" cy="490" r="45" fill="#E0CA72" stroke="#1C1C1C" stroke-width="2.5"/>

  <!-- Weight labels "1" and "···" -->
  <text x="363" y="90"  font-size="42" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="363" y="290" font-size="42" text-anchor="middle" dominant-baseline="central">&#x22EF;</text>
  <text x="363" y="490" font-size="42" text-anchor="middle" dominant-baseline="central">1</text>

  <!-- Vertex labels -->
  <!-- x_1 -->
  <text x="197" y="92" font-size="34" font-style="italic" text-anchor="middle">x</text>
  <text x="219" y="107" font-size="22" font-style="italic" text-anchor="middle">1</text>
  <!-- x_i -->
  <text x="197" y="292" font-size="34" font-style="italic" text-anchor="middle">x</text>
  <text x="219" y="307" font-size="22" font-style="italic" text-anchor="middle">i</text>
  <!-- x_d -->
  <text x="197" y="492" font-size="34" font-style="italic" text-anchor="middle">x</text>
  <text x="219" y="507" font-size="22" font-style="italic" text-anchor="middle">d</text>

  <!-- y_1 -->
  <text x="487" y="92" font-size="34" font-style="italic" text-anchor="middle">y</text>
  <text x="509" y="107" font-size="22" font-style="italic" text-anchor="middle">1</text>
  <!-- y_i -->
  <text x="487" y="292" font-size="34" font-style="italic" text-anchor="middle">y</text>
  <text x="509" y="307" font-size="22" font-style="italic" text-anchor="middle">i</text>
  <!-- y_d -->
  <text x="487" y="492" font-size="34" font-style="italic" text-anchor="middle">y</text>
  <text x="509" y="507" font-size="22" font-style="italic" text-anchor="middle">d</text>

</svg>
